services:
  gateway:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "gateway.js"]
    environment:
      PORT: "8088"
      LISTEN: "0.0.0.0"
      # directory holding one cookie file per user: <user>.json
      COOKIES_DIR: /cookies
      # set your public gateway domain (configure.sh fills this)
      PUBLIC_HOST: ${PUBLIC_HOST:-claude.example.com}
    volumes:
      - ./gateway/src:/app:ro
      # writable: the gateway stores each user's session cookies here
      - ./gateway/cookies:/cookies
    # hardening: no extra privileges, read-only root fs, no published ports
    # (reachable only from caddy over the internal docker network)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gateway

volumes:
  caddy-data: null
  caddy-config: null
