services:
  frontdoor:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "/app/port443-mux.py"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to the gateway domain}
      CONNECT_HOST: ${CONNECT_HOST:?set CONNECT_HOST to the public IP}
      # Optional fixed-category interval counters; never includes client data.
      FRONTDOOR_DIAGNOSTICS: ${FRONTDOOR_DIAGNOSTICS:-0}
    ports:
      - "443:443"
    volumes:
      - ./port443-mux.py:/app/port443-mux.py:ro
    networks:
      transport:
        ipv4_address: ${FRONTDOOR_IP:-172.30.240.2}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # One thread per connection: MAX_CONNECTIONS (1024) plus the accept and
    # diagnostics threads must fit pids_limit.
    mem_limit: 512m
    pids_limit: 1100
    depends_on:
      caddy:
        condition: service_started
      gateway:
        condition: service_started

  gateway:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "gateway.js"]
    environment:
      PORT: "8088"
      LISTEN: "0.0.0.0"
      COOKIES_DIR: /cookies
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to the gateway domain}
      COOKIES_KEY: ${COOKIES_KEY:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # HTTPS CONNECT reaches the origin IP directly; TLS authenticates that IP.
      CONNECT_HOST: ${CONNECT_HOST:?set CONNECT_HOST to the public IP}
      CONNECT_PORT: "8443"
      CONNECT_ADVERTISE: https://${CONNECT_HOST}:443
      CONNECT_TLS_CERT: /connect-cert/${CONNECT_HOST}.crt
      CONNECT_TLS_KEY: /connect-cert/${CONNECT_HOST}.key
    volumes:
      - ./gateway/src:/app:ro
      - ./gateway/cookies:/cookies
      - ./extension:/ext:ro
      # Expose only the IP certificate, never other sites' TLS private keys.
      # Caddy's HTTP-01 healthcheck provisions this directory before gateway starts.
      - type: volume
        source: caddy-data
        target: /connect-cert
        read_only: true
        volume:
          nocopy: true
          subpath: caddy/certificates/acme-v02.api.letsencrypt.org-directory/${CONNECT_HOST}
    networks: [transport]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      caddy:
        condition: service_healthy

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      CONNECT_HOST: ${CONNECT_HOST:?set CONNECT_HOST to the public IP}
      FRONTDOOR_IP: ${FRONTDOOR_IP:-172.30.240.2}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./privacy.html:/srv/privacy/index.html:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [transport]
    # Holds the admin socket; recreated empty on every container start.
    tmpfs:
      - /run/caddy:mode=0700
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -s "/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/$$CONNECT_HOST/$$CONNECT_HOST.crt" && test -s "/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/$$CONNECT_HOST/$$CONNECT_HOST.key"'
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s

networks:
  transport:
    ipam:
      config:
        - subnet: ${FRONTDOOR_SUBNET:-172.30.240.0/24}
          # Keep dynamic Caddy/gateway addresses away from frontdoor's static IP.
          # Custom subnet/range overrides must contain the static FRONTDOOR_IP
          # in the subnet, but outside this dynamic allocation range.
          ip_range: ${TRANSPORT_IP_RANGE:-172.30.240.128/25}

volumes:
  caddy-data: null
  caddy-config: null
