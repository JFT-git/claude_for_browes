<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; width: 300px; margin: 0; padding: 16px; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  .row { display: flex; align-items: center; margin: 8px 0; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .ok { background: #22c55e; }
  .bad { background: #ef4444; }
  .warn { background: #f59e0b; }
  .unknown { background: #9ca3af; }
  .host { color: #6b7280; font-size: 12px; word-break: break-all; }
  button { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  button.primary { background: #4f46e5; color: #fff; border: none; }
  button:hover { opacity: 0.9; }
  #status-text { flex: 1; }
</style>
</head>
<body>
  <h3>Claude Gateway</h3>
  <div class="row"><span id="dot" class="dot unknown"></span><span id="status-text">Checking…</span></div>
  <div class="row host" id="host"></div>
  <button id="open" class="primary">Open Claude</button>
  <button id="test">Test connection</button>
  <button id="settings">Settings</button>
  <script src="popup.js"></script>
</body>
</html>
