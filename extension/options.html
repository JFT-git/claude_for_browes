<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h2 { margin-bottom: 8px; }
  .hint { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 500; }
  input { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 13px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  button.primary { background: #4f46e5; color: #fff; border: none; }
  #status { margin-left: 12px; font-size: 13px; }
  .warn { color: #f59e0b; } .err { color: #ef4444; }
  #perm-status { margin-top: 20px; padding: 12px; background: #f3f4f6; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
  <h2>Gateway Connector — Настройки</h2>
  <p class="hint">Одна сборка для всех доменов. Введите домен вашего шлюза и нажмите «Сохранить и разрешить».</p>
  <label>Домен шлюза</label>
  <input id="host" placeholder="claude.example.com">
  <label>Пользователь</label>
  <input id="user" placeholder="owner">
  <label>Пароль</label>
  <input id="pass" type="password">
  <button id="save" class="primary">Сохранить и разрешить</button>
  <button id="grant">Только разрешить доступ</button>
  <span id="status" style="display:none"></span>
  <div id="perm-status">…</div>
  <script src="options.js"></script>
</body>
</html>
