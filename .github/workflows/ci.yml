name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Prepare Caddy runtime log tests
        run: |
          caddy_fixture_container="$(docker create caddy:2.11.7)"
          trap 'docker rm -fv "$caddy_fixture_container" >/dev/null' EXIT
          docker cp "$caddy_fixture_container:/usr/bin/caddy" "$RUNNER_TEMP/caddy-2.11.7"
          chmod +x "$RUNNER_TEMP/caddy-2.11.7"
          "$RUNNER_TEMP/caddy-2.11.7" version
          echo "CADDY_TEST_BIN=$RUNNER_TEMP/caddy-2.11.7" >> "$GITHUB_ENV"
      - run: npm test
      - name: validate Caddyfile
        run: |
          sed -i 's/__DOMAIN__/claude.example.com/; s/__BASIC_AUTH_USER__ __BASIC_AUTH_HASH__/u $2a$14$abcdefghijklmnopqrstuuabcdefghijklmnopqrstuvwxyz01234/' server/Caddyfile.template
          docker run --rm -e CONNECT_HOST=203.0.113.10 -e FRONTDOOR_IP=172.30.240.2 -v "$PWD/server/Caddyfile.template:/etc/caddy/Caddyfile:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile

  build-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build Chrome + Firefox add-ons
        run: npm run build:extension
      - name: Lint Firefox add-on
        run: npm run lint:firefox
      - name: Check no placeholders remain
        run: |
          ! grep -r "__GATEWAY" extension/dist/ || { echo "placeholders leaked into build"; exit 1; }
      - name: Check fingerprint script is included
        run: |
          test -f extension/dist/chrome/fingerprint.js
          test -f extension/dist/firefox/fingerprint.js
      - name: Upload Chrome add-on
        uses: actions/upload-artifact@v4
        with:
          name: claude-gateway-chrome
          path: extension/dist/claude-gateway-chrome.zip
          if-no-files-found: error
      - name: Upload Firefox add-on
        uses: actions/upload-artifact@v4
        with:
          name: claude-gateway-firefox
          path: extension/dist/claude-gateway-firefox.zip
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run test:fingerprint
      - run: npm run test:browser

  release:
    needs: [test, build-addons, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build placeholder release zips
        run: ./extension/release.sh
      - name: Get version
        id: ver
        run: |
          V=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' extension/manifest.chrome.json | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          gh release create "$TAG" \
            --title "Claude Gateway $V" \
            --notes "Prebuilt extension packages are not bound to a gateway. Install the package, open the extension Options, enter your gateway host, username, and password, then save and grant the requested host permissions." \
            releases/claude-gateway-chrome-v$V.zip \
            releases/claude-gateway-firefox-v$V.zip \
            releases/SHA256SUMS \
            --target main || true
      - name: Check AMO secrets
        id: amo
        run: |
          if [ -n "${{ secrets.AMO_API_KEY }}" ] && [ -n "${{ secrets.AMO_API_SECRET }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign Firefox add-on on AMO (unlisted)
        if: steps.amo.outputs.present == 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set +e
          npx --no-install web-ext sign --source-dir extension/dist/firefox \
            --artifacts-dir extension/dist/amo-signed \
            --channel unlisted --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET" > /tmp/amo-sign.txt 2>&1
          code=$?
          cat /tmp/amo-sign.txt
          if [ "$code" -ne 0 ]; then
            if grep -q "Conflict" /tmp/amo-sign.txt; then
              echo "This Firefox version is already signed — continuing"
              exit 0
            fi
            exit "$code"
          fi
      - name: Attach signed XPI to release + update updates.json
        if: steps.amo.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          XPI=$(ls extension/dist/amo-signed/*.xpi 2>/dev/null | head -1)
          if [ -z "$XPI" ]; then
            echo "No new signed XPI — this version is already on AMO"
            exit 0
          fi
          OUT="gateway-connector-firefox-$V.xpi"
          cp "$XPI" "$OUT"
          gh release upload "v$V" "$OUT" --clobber
          python3 extension/update-updates-json.py "$V" updates.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add updates.json
          git commit -m "updates.json: signed xpi for v$V [skip ci]" || true
          git push
      - name: Check Chrome Web Store secrets
        id: cws
        if: always()
        run: |
          if [ -n "${{ secrets.CWS_CLIENT_ID }}" ] && [ -n "${{ secrets.CWS_CLIENT_SECRET }}" ] \
            && [ -n "${{ secrets.CWS_REFRESH_TOKEN }}" ] && [ -n "${{ secrets.CWS_PUBLISHER_ID }}" ] \
            && [ -n "${{ secrets.CWS_EXTENSION_ID }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Chrome add-on
        if: always() && steps.cws.outputs.present == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: ./extension/publish-chrome.sh
