name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Prepare Caddy runtime log tests
        run: |
          caddy_fixture_container="$(docker create caddy:2.11.7)"
          trap 'docker rm -fv "$caddy_fixture_container" >/dev/null' EXIT
          docker cp "$caddy_fixture_container:/usr/bin/caddy" "$RUNNER_TEMP/caddy-2.11.7"
          chmod +x "$RUNNER_TEMP/caddy-2.11.7"
          "$RUNNER_TEMP/caddy-2.11.7" version
          echo "CADDY_TEST_BIN=$RUNNER_TEMP/caddy-2.11.7" >> "$GITHUB_ENV"
      - run: npm test
      - name: validate Caddyfile
        run: |
          sed -i 's/__DOMAIN__/claude.example.com/; s/__BASIC_AUTH_USER__ __BASIC_AUTH_HASH__/u $2a$14$abcdefghijklmnopqrstuuabcdefghijklmnopqrstuvwxyz01234/' server/Caddyfile.template
          docker run --rm -e CONNECT_HOST=203.0.113.10 -e FRONTDOOR_IP=172.30.240.2 -v "$PWD/server/Caddyfile.template:/etc/caddy/Caddyfile:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile

  build-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build Chrome + Firefox add-ons
        run: npm run build:extension
      - name: Lint Firefox add-on
        run: npm run lint:firefox
      - name: Check no placeholders remain
        run: |
          ! grep -r "__GATEWAY" extension/dist/ || { echo "placeholders leaked into build"; exit 1; }
      - name: Check fingerprint script is included
        run: |
          test -f extension/dist/chrome/fingerprint.js
          test -f extension/dist/firefox/fingerprint.js
      - name: Upload Chrome add-on
        uses: actions/upload-artifact@v4
        with:
          name: claude-gateway-chrome
          path: extension/dist/claude-gateway-chrome.zip
          if-no-files-found: error
      - name: Upload Firefox add-on
        uses: actions/upload-artifact@v4
        with:
          name: claude-gateway-firefox
          path: extension/dist/claude-gateway-firefox.zip
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run test:fingerprint
      - run: npm run test:browser

  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '158.0'
      - name: Native Firefox route and artifact checks
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          # The direct-egress control must be reachable at the real HTTPS port.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          npm run test:firefox

  version:
    runs-on: ubuntu-latest
    outputs:
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
      # Pushes that do not raise the manifest version (docs, CI) skip the release.
      - id: check
        run: |
          set -eu
          V=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' extension/manifest.chrome.json | head -1)
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$V" "refs/tags/v$V^{}")" ]; then
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$V is already released; nothing to publish."
          fi

  release:
    needs: [test, build-addons, browser, firefox, version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.version.outputs.unpublished == 'true'
    concurrency:
      group: signed-extension-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build placeholder release zips
        run: ./extension/release.sh
      - name: Get version
        id: ver
        run: |
          V=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' extension/manifest.chrome.json | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Require an unpublished version
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/v$V" "refs/tags/v$V^{}")
          test -z "$EXISTING_TAG" || { echo "Version tag already exists; refusing to replace release content."; exit 1; }
      - name: Require a changelog entry
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" 'found && /^## / { exit } found { print } $0 == "## " v || index($0, "## " v " ") == 1 { found = 1 }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || { echo "CHANGELOG.md has no entry for $V"; exit 1; }
          printf '\n---\n%s\n' "Signed Firefox Desktop add-on and Chrome package. Use a dedicated Chrome profile; Firefox restricts only Claude traffic and works in the everyday profile. Open Options, enter the gateway and credentials, and grant gateway access. See SECURITY.md for tested scenarios and limitations." >> "$RUNNER_TEMP/release-notes.md"
      - name: Sign Firefox add-on on AMO (unlisted)
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -eu
          test -n "$AMO_API_KEY" && test -n "$AMO_API_SECRET"
          mkdir -p "$RUNNER_TEMP/amo-signed"
          test -z "$(ls -A "$RUNNER_TEMP/amo-signed")"
          # web-ext sign writes .amo-upload-uuid into its source directory; sign a
          # copy so extension/dist/firefox stays the exact payload to verify.
          cp -R extension/dist/firefox "$RUNNER_TEMP/amo-source"
          npx --no-install web-ext sign --source-dir "$RUNNER_TEMP/amo-source" \
            --artifacts-dir "$RUNNER_TEMP/amo-signed" \
            --channel unlisted --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"
      - name: Verify signed payload and prepare release assets
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          mapfile -t XPIS < <(find "$RUNNER_TEMP/amo-signed" -maxdepth 1 -type f -name '*.xpi')
          test "${#XPIS[@]}" -eq 1
          python3 extension/verify-firefox-package.py extension/dist/firefox "${XPIS[0]}" "$V"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "releases/claude-gateway-chrome-v$V.zip" "$RUNNER_TEMP/release-assets/"
          cp "releases/claude-gateway-firefox-v$V.zip" "$RUNNER_TEMP/release-assets/"
          cp "${XPIS[0]}" "$RUNNER_TEMP/release-assets/gateway-connector-firefox-$V.xpi"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum ./*.zip ./*.xpi > SHA256SUMS
      - name: Upload and verify draft before publishing Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          gh release create "$TAG" --draft --latest=false --target "$GITHUB_SHA" \
            --title "Claude Gateway $V" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/release-assets/claude-gateway-chrome-v$V.zip" \
            "$RUNNER_TEMP/release-assets/claude-gateway-firefox-v$V.zip" \
            "$RUNNER_TEMP/release-assets/gateway-connector-firefox-$V.xpi" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS"
          mkdir -p "$RUNNER_TEMP/release-downloaded"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-downloaded"
          diff "$RUNNER_TEMP/release-assets/SHA256SUMS" "$RUNNER_TEMP/release-downloaded/SHA256SUMS"
          (cd "$RUNNER_TEMP/release-downloaded" && sha256sum --check SHA256SUMS)
          gh release edit "$TAG" --draft=false --latest
      - name: Publish Firefox update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          python3 extension/update-updates-json.py "$V" updates.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add updates.json
          if ! git diff --cached --quiet; then
            git commit -m "updates.json: signed xpi for v$V [skip ci]"
            git push
          fi
      - name: Check Chrome Web Store secrets
        id: cws
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] \
            && [ -n "$CWS_REFRESH_TOKEN" ] && [ -n "$CWS_PUBLISHER_ID" ] \
            && [ -n "$CWS_EXTENSION_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Chrome add-on
        if: steps.cws.outputs.present == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: ./extension/publish-chrome.sh
